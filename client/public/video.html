<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Video Player</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: black;
        position: relative;
      }
      #video-player,
      #youtube-player {
        width: 100%;
        height: 100%;
        object-fit: contain;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="youtube-player" style="display: none"></div>
    <video
      id="video-player"
      autoplay
      style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: fill"></video>
    <video
      id="idle-video-player"
      autoplay
      style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%)"></video>
    <div
      id="idle-carousel"
      style="
        display: none;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 5;
        width: 100%;
        height: 100%;
        background-color: black;
        overflow: hidden;
      ">
      <img id="carousel-image" style="width: 100%; height: 100%; object-fit: contain; display: none" />
      <video
        id="carousel-video"
        autoplay
        playsinline
        style="pointer-events: none; width: 100%; height: 100%; object-fit: contain; display: none"
        muted></video>
    </div>
    <img id="standby-image" style="width: 100%; height: 100%; object-fit: contain" src="./logo_with_bg.png" />

    <div
      id="next-song-info"
      style="
        position: absolute;
        top: 30px;
        right: 0px;
        width: 100%;
        text-align: center;
        color: #fff;
        font-size: 2.2rem;
        font-family: sans-serif;
        z-index: 100;
        padding-right: 20px;
        text-align: end;
        text-shadow: 2px 2px 8px #000;
        display: block;
      "></div>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="./video.bundle.js"></script>
  </body>
</html>
